<div class="page-container">
  <app-page-header
    eyebrow="YOUR CONNECTIONS"
    title="My Lists"
    description="Organize your favorite members"
  >
    <app-button
      page-actions
      label="Create List"
      variant="primary"
      icon="plus"
      [disabled]="true"
    />
  </app-page-header>

  @if (!accountService.currentUser()) {
    <app-empty-state
      title="Sign in to create lists"
      description="Create custom lists to organize members you're interested in"
    >
      <div empty-icon>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
      </div>
      <div empty-actions>
        <app-button label="Sign In" variant="primary" routerLink="/login" />
        <app-button label="Create Account" variant="outline" routerLink="/register" />
      </div>
    </app-empty-state>
  } @else {
    <div class="space-y-6">
      <app-empty-state
        title="No lists yet"
        description="Create your first list to start organizing members you like"
      >
        <div empty-icon>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div empty-actions>
          <app-button
            label="Create Your First List"
            variant="primary"
            icon="plus"
            [disabled]="true"
          />
        </div>
      </app-empty-state>

      <!-- Feature cards -->
      <div class="grid md:grid-cols-3 gap-6">
        <app-card variant="bordered" padding="lg" class="text-center">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary/10 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
          </div>
          <h3 class="font-semibold text-base-content mb-2">Favorites</h3>
          <p class="text-base-content/60 text-sm">Save members you like for quick access</p>
        </app-card>
        
        <app-card variant="bordered" padding="lg" class="text-center">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-secondary/10 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" /></svg>
          </div>
          <h3 class="font-semibold text-base-content mb-2">Custom Lists</h3>
          <p class="text-base-content/60 text-sm">Create themed lists for different interests</p>
        </app-card>
        
        <app-card variant="bordered" padding="lg" class="text-center">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-accent/10 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
          </div>
          <h3 class="font-semibold text-base-content mb-2">Smart Filters</h3>
          <p class="text-base-content/60 text-sm">Auto-organize by location, interests, and more</p>
        </app-card>
      </div>
    </div>
  }
</div>
